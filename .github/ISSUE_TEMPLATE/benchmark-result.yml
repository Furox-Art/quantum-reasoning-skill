name: Benchmark result
description: Submit an independently run baseline-vs-skill model evaluation
title: "[Benchmark] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Submit reproducible measurements only. Do not include private chain-of-thought. For PR submissions, validate the full bundle with `python benchmark/validate_submission.py --root benchmark/results/community`.

  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: Provider or local runtime
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Exact model / version
      placeholder: Exact model identifier and version if available
    validations:
      required: true

  - type: input
    id: skill_version
    attributes:
      label: Skill version / commit
      placeholder: v0.3.1 or commit SHA
    validations:
      required: true

  - type: input
    id: run_date
    attributes:
      label: Run date
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: textarea
    id: controls
    attributes:
      label: Experimental controls
      description: Describe sampling settings, context/output limits, tools, repetitions, seeds, prompt wrapper and hardware/runtime when relevant.
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Result artifacts
      description: Link or attach metadata.json, cases.jsonl, baseline.jsonl, skill.jsonl, comparison.json and README.md. State whether the bundle passed validate_submission.py.
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Result summary
      description: Report accuracy and compute/cost trade-offs. Include failures, refusals and timeouts.
    validations:
      required: true

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity checks
      options:
        - label: Baseline and skill used the same model/version, task set, tools, sampling settings and budget policy.
          required: true
        - label: I included the exact evaluated cases and did not remove failed runs, refusals or timeouts.
          required: true
        - label: comparison.json was generated from the submitted raw files and was not edited to improve the result.
          required: true
        - label: I did not include private chain-of-thought or fabricate unavailable telemetry.
          required: true
        - label: I disclosed modifications to SKILL.md, benchmark cases, wrappers or provider adapters.
          required: true
