name: PyPI Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(f"name={project['name']}")
          print(f"version={project['version']}")
          PY

      - name: Refuse an existing PyPI version
        shell: bash
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}/json"
          if curl --retry 3 --retry-delay 2 --retry-all-errors -sfL "$url" >/dev/null; then
            echo "::error::${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} already exists on PyPI."
            exit 1
          fi

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Detect API token fallback
        id: auth
        shell: bash
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with PyPI Trusted Publishing
        id: trusted
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        continue-on-error: true

      - name: Publish with API token fallback
        id: token
        if: steps.trusted.outcome != 'success' && steps.auth.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

      - name: Require successful upload
        if: steps.trusted.outcome != 'success'
        shell: bash
        run: |
          if [ "${{ steps.token.outcome }}" != "success" ]; then
            echo "::error::PyPI upload failed. Configure Trusted Publishing for this workflow or add PYPI_API_TOKEN."
            exit 1
          fi

      - name: Verify public PyPI version
        shell: bash
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}/json"
          for attempt in $(seq 1 20); do
            if curl --retry 2 --retry-delay 2 --retry-all-errors -sfL "$url" >/dev/null; then
              echo "PyPI sees ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Upload succeeded but the public PyPI JSON endpoint has not propagated yet."
