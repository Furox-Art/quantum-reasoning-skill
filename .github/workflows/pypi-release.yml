name: PyPI Release

# Publishing is gated on `push` to the default branch only. It is deliberately
# NOT triggered by `workflow_run` (which lets a fork trigger privileged code)
# and NOT by `pull_request` (which is untrusted). The caller must be able to
# push to main, which already implies write access.
on:
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"
      - "pyproject.toml"
      - "VERSION"
      - "quantum_reasoning_skill/**"
  workflow_dispatch:

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Belt and braces: the `if` re-asserts the default-branch gate even if the
    # trigger is ever widened.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing via OIDC; no long-lived secret is used.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(f"name={project['name']}")
          print(f"version={project['version']}")
          PY

      - name: Require an unreleased version
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          version="${{ steps.meta.outputs.version }}"
          version_file="$(tr -d '[:space:]' < VERSION)"
          version_file="${version_file#v}"
          if [ "$version_file" != "$version" ]; then
            echo "::error::pyproject.toml ($version) does not match VERSION ($version_file)." >&2
            exit 1
          fi
          url="https://pypi.org/pypi/$name/$version/json"
          if curl --retry 3 --retry-delay 2 --retry-all-errors -sfL "$url" >/dev/null; then
            echo "::error::$name $version is already published to PyPI. Bump VERSION and pyproject.toml." >&2
            exit 1
          fi

      - name: Build and validate distributions
        run: |
          set -euo pipefail
          # twine >= 7.0.0 is required: 6.x hardcodes a metadata-version list
          # ending at 2.4, so `twine check --strict` rejects artifacts whose
          # backend legitimately emits Metadata-Version 2.5. Guarded in CI by
          # `python bin/check_toolchain_pins.py`.
          python -m pip install --disable-pip-version-check "build==1.2.2.post1" "twine==7.0.0"
          python -m build --outdir dist
          python -m twine check --strict dist/*

      # The contract gate is re-run here so a release can never be produced from
      # a commit whose wheel does not carry the skill contract, the console entry
      # point, and a working reference controller. Same check CI enforces,
      # re-executed against the freshly built wheel.
      - name: Install the built wheel
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl | head -n1)"
          echo "Installing $wheel"
          python -m pip install --disable-pip-version-check "$wheel"
          quantum-reasoning --validate

      - name: Assert the installed distribution contract
        run: python bin/check_release_contract.py

      - name: Negative control (gate must be fail-closed)
        run: python bin/check_release_contract.py --negative-control

      - name: Detect API token fallback
        id: auth
        shell: bash
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      # Two mutually exclusive paths, each fully checked. `continue-on-error`
      # is deliberately absent so a failed upload fails the job.
      - name: Publish with PyPI Trusted Publishing
        id: trusted
        if: steps.auth.outputs.has_token != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

      - name: Publish with API token
        id: token
        if: steps.auth.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Verify public PyPI version
        shell: bash
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}/json"
          for attempt in $(seq 1 20); do
            if curl --retry 2 --retry-delay 2 --retry-all-errors -sfL "$url" >/dev/null; then
              echo "PyPI sees ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Upload did not propagate to the public PyPI JSON endpoint." >&2
          exit 1