name: PyPI Release

# Publishing is gated on `push` to the default branch, or a manual dispatch made
# from that branch. It is deliberately NOT triggered by `workflow_run` (which
# lets a fork trigger privileged code) and NOT by `pull_request` (which is
# untrusted). The caller must be able to push to main, which already implies
# write access.
#
# OIDC Trusted Publishing is the default for every event, so every upload can
# carry a PEP 740 attestation. The long-lived token path is available only via
# the explicit `use_token_fallback` dispatch input, and fails closed if that
# secret is missing; the mere presence of the secret no longer selects it.
#
# The `paths` list below is the complete set of files that can change what ships:
# everything the wheel and the sdist contain (see the `only-include`/`include`
# lists in pyproject.toml), the files hatchling embeds, the release gates this
# job runs, and the version-bearing citation surfaces (`CITATION.cff`,
# `codemeta.json`). Leaving one out publishes a stale artifact: the version is
# already unpublished, the workflow is never triggered, and the change reaches
# neither registry. The citation surfaces are listed even though `codemeta.json`
# ships in no artifact, because it carries the release version and shipped stale
# once already (1.1.3 published with `codemeta.json` still saying 1.1.0); an edit
# to release metadata must re-run these gates. tests/test_publish_triggers.py
# derives the artifact inputs from pyproject.toml and package.json and fails when
# an artifact input is missing from the filter.
on:
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"
      - ".github/**"
      - "pyproject.toml"
      - "VERSION"
      - "README.md"
      - "LICENSE"
      - "SKILL.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CITATION.cff"
      - "codemeta.json"
      - "index.js"
      - "package.json"
      - "quantum_reasoning_skill/**"
      - "docs/**"
      - "examples/**"
      - "bin/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      use_token_fallback:
        description: >-
          Deliberately publish with the long-lived PYPI_API_TOKEN secret instead
          of OIDC Trusted Publishing. Only set this when the PyPI trusted
          publisher is unavailable. Token publishes carry no PEP 740
          attestation.
        type: boolean
        required: false
        default: false

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    # A version must never reach PyPI from a commit the suite has not passed.
    # The same guard also refuses a manual dispatch from a tag or another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check "coverage==7.16.2" "pyyaml==6.0.3"

      - name: Enforce 100% statement and branch coverage with zero skips
        shell: bash
        run: |
          set -euo pipefail
          coverage run -m unittest discover -s tests -v 2>&1 | tee unittest-coverage.log
          if grep -Eq "skipped=[1-9][0-9]*" unittest-coverage.log; then
            echo "::error::Skipped tests are not permitted"
            exit 1
          fi
          coverage report --fail-under=100

  validate-skill:
    # PyPI must not publish from a commit that failed the unprivileged
    # validate-skill workflow. That workflow starts from the same push, so poll
    # for its required checks instead of querying once and racing them.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Wait for the validate-skill checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python bin/wait_for_required_checks.py \
            --repo "${{ github.repository }}" \
            --ref "${{ github.sha }}" \
            --context "installed API contract" \
            --context "repository contract" \
            --timeout 300 \
            --interval 15

  publish:
    needs: [test, validate-skill]
    # Belt and braces: the `if` re-asserts the default-branch gate even if the
    # trigger is ever widened.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC Trusted Publishing is the default. The long-lived token fallback,
      # when explicitly requested, still only has read access to the repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(f"name={project['name']}")
          print(f"version={project['version']}")
          PY

      - name: Validate version lockstep and check PyPI
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          version="${{ steps.meta.outputs.version }}"
          # Every surface that carries the release version, not just pyproject
          # versus VERSION: package.json, CITATION.cff, codemeta.json, CHANGELOG
          # and SKILL.md's front matter all ship to consumers or cite the
          # release. The `.github/pypi-release-trigger` file is a marker only
          # and carries no version. The package `__init__.py` has no version
          # attribute to compare.
          python - <<'PY'
          import conftest

          failures = conftest.release_version_failures()
          if failures:
              raise SystemExit("version lockstep violated: " + "; ".join(failures))
          print("Version lockstep OK across every version-bearing surface:", conftest.repo_version())
          PY
          url="https://pypi.org/pypi/$name/$version/json"
          if curl --retry 3 --retry-delay 2 --retry-all-errors -sfL "$url" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name $version is already published to PyPI; treating this trigger as an idempotent no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$name $version is not published yet."
          fi

      # Two supported modes. OIDC is the default for automatic pushes and for
      # manual dispatches that do not opt in. Both are fail-closed: a requested
      # mode with no usable credential exits before any upload step.
      - name: Resolve the requested publish mode
        id: mode
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TOKEN: ${{ inputs.use_token_fallback }}
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "${REQUESTED_TOKEN:-false}" in
              true|True|TRUE) requested="token" ;;
              false|False|FALSE|"") requested="trusted" ;;
              *)
                echo "::error::use_token_fallback must be a boolean, got '${REQUESTED_TOKEN}'" >&2
                exit 1
                ;;
            esac
          else
            requested="trusted"
          fi

          echo "requested=$requested" >> "$GITHUB_OUTPUT"

          if [ "$requested" = "token" ]; then
            if [ -z "${PYPI_TOKEN:-}" ]; then
              echo "::error::use_token_fallback was requested but the PYPI_API_TOKEN secret is not set. Refusing to publish." >&2
              exit 1
            fi
            echo "::warning::Publishing with PYPI_API_TOKEN. This path carries no PEP 740 attestation." >&2
          else
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::error::OIDC publishing is the default but this job cannot mint an OIDC token." >&2
              echo "::error::Check that the publish job still grants id-token: write, or use an explicit token-mode dispatch." >&2
              exit 1
            fi
            echo "::notice::Publishing with OIDC Trusted Publishing and PEP 740 attestations."
          fi

      - name: Build and validate distributions
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # twine >= 7.0.0 is required: 6.x hardcodes a metadata-version list
          # ending at 2.4, so `twine check --strict` rejects artifacts whose
          # backend legitimately emits Metadata-Version 2.5. Guarded in CI by
          # `python bin/check_toolchain_pins.py`.
          python -m pip install --disable-pip-version-check "build==1.6.1" "twine==7.0.0"
          python -m build --outdir dist
          python -m twine check --strict dist/*

      # The contract gate is re-run here so a release can never be produced from
      # a commit whose wheel does not carry the skill contract, the console entry
      # point, and a working reference controller. Same check CI enforces,
      # re-executed against the freshly built wheel.
      - name: Install the built wheel
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl | head -n1)"
          echo "Installing $wheel"
          python -m pip install --disable-pip-version-check "$wheel"
          quantum-reasoning --validate

      - name: Assert the installed distribution contract
        if: steps.gate.outputs.skip != 'true'
        run: python bin/check_release_contract.py

      - name: Negative control (gate must be fail-closed)
        if: steps.gate.outputs.skip != 'true'
        run: python bin/check_release_contract.py --negative-control

      # Two mutually exclusive paths, each fully checked. `continue-on-error`
      # is deliberately absent so a failed upload fails the job.
      - name: Publish with PyPI Trusted Publishing
        id: trusted
        if: steps.gate.outputs.skip != 'true' && steps.mode.outputs.requested == 'trusted'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

      - name: Publish with API token
        id: token
        if: steps.gate.outputs.skip != 'true' && steps.mode.outputs.requested == 'token'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # Neither publish step tolerates failure, so a skipped step here means the
      # selected mode did not run at all.
      - name: Require the selected upload path to succeed
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          REQUESTED: ${{ steps.mode.outputs.requested }}
          TRUSTED_OUTCOME: ${{ steps.trusted.outcome }}
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "trusted" ]; then
            if [ "$TRUSTED_OUTCOME" != "success" ]; then
              echo "::error::PyPI Trusted Publishing did not run or failed." >&2
              exit 1
            fi
          else
            if [ "$TOKEN_OUTCOME" != "success" ]; then
              echo "::error::the explicit PYPI_API_TOKEN publish did not run or failed." >&2
              exit 1
            fi
          fi
          echo "PyPI accepted the upload (mode: $REQUESTED)"

      - name: Verify public PyPI version
        shell: bash
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}/json"
          for attempt in $(seq 1 20); do
            if curl --retry 2 --retry-delay 2 --retry-all-errors -sfL "$url" >/dev/null; then
              echo "PyPI sees ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Upload did not propagate to the public PyPI JSON endpoint." >&2
          exit 1
