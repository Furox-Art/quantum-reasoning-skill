name: npm Publish

# npm is a supported distribution channel again, so publishing is real.
#
# Triggering is deliberately narrow: a default-branch push that changes a file
# capable of changing what ships. The `paths` list is every input `npm pack`
# reads -- the `files` allowlist in package.json, package.json itself and
# .npmignore -- plus the version-bearing citation surfaces (`CITATION.cff`,
# which this job's own version-lockstep gate reads, and `codemeta.json`, the
# sixth version surface that shipped stale in 1.1.3), so a tarball-affecting
# change and a release-metadata change can never be silently skipped. A change
# that can reach neither (CI configuration, tests, CONTRIBUTING, the Python
# reference and benchmark sources) still cannot attempt a release.
# tests/test_publish_triggers.py derives the tarball inputs from package.json
# and fails when a tarball input is missing from it.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "index.js"
      - "VERSION"
      - "SKILL.md"
      - "LICENSE"
      - "README.md"
      - ".npmignore"
      - "CITATION.cff"
      - "codemeta.json"
  workflow_dispatch:
    inputs:
      use_token_fallback:
        description: >-
          Deliberately publish with the long-lived NPM_TOKEN instead of OIDC
          Trusted Publishing. Only set this when the npmjs.com trusted publisher
          is not configured. Token publishes cannot be provenance-signed.
        type: boolean
        required: false
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Belt and braces: the privileged path is only ever reachable from the
    # default branch, whether by push or by a manual dispatch made from it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # OIDC token exchange for npm Trusted Publishing and provenance.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish guard below walks back to the commit that introduced
          # the version being published; a depth-1 clone has no such history.
          fetch-depth: 0

      # npm must not publish a commit that failed the unprivileged
      # validate-skill workflow. That workflow starts from the same push, so
      # poll for its required checks instead of racing them. The budget is 900s,
      # not 300s: run 39700228441 gave up after 300s while "installed API
      # contract" was still queued behind the runner queue.
      - name: Wait for required checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python bin/wait_for_required_checks.py \
            --repo "${{ github.repository }}" \
            --ref "${{ github.sha }}" \
            --context "installed API contract" \
            --context "repository contract" \
            --timeout 900 \
            --interval 15

      # npm CLI >= 11.21.0 is required for OIDC trusted publishing with an
      # explicit dist-tag (`--tag` below); the npm bundled with Node 24 can be
      # older. The requirement is checked numerically rather than by regex:
      # a pattern like ^11\.(5[1-9]|[6-9][0-9])\. rejects legitimate versions
      # such as 11.9.0 and 11.19.0, because 5[1-9] does not match 19.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install an OIDC-capable npm
        run: npm install --global "npm@^11.21.0"

      - name: Require npm 11.21.0 or newer for OIDC dist-tags
        shell: bash
        run: |
          set -euo pipefail
          # FAKE_NPM_VERSION exists so the comparison below can be tested against
          # versions this runner does not have; it is unset in real runs.
          raw="${FAKE_NPM_VERSION:-$(npm --version)}"
          echo "npm CLI $raw"
          node -e '
            const raw = process.argv[1];
            const m = /^(\d+)\.(\d+)\.(\d+)/.exec(raw);
            if (!m) {
              console.error(`cannot parse npm version: ${raw}`);
              process.exit(1);
            }
            const [major, minor, patch] = [Number(m[1]), Number(m[2]), Number(m[3])];
            // Numeric comparison: >= 11.21.0
            const ok =
              major > 11 ||
              (major === 11 && (minor > 21 || (minor === 21 && patch >= 0)));
            if (!ok) {
              console.error(
                `npm ${raw} is too old; OIDC trusted publishing with an explicit dist-tag requires 11.21.0 or newer.`
              );
              process.exit(1);
            }
            console.log(`npm ${raw} satisfies the OIDC dist-tag requirement`);
          ' "$raw"

      - name: Resolve version and require lockstep across every version surface
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          version_file="$(tr -d '[:space:]' < VERSION)"
          version_file="${version_file#v}"
          if [ "$version_file" != "$version" ]; then
            echo "::error::package.json ($version) does not match VERSION ($version_file)." >&2
            exit 1
          fi
          # Every version-bearing surface must agree, including the SKILL.md
          # front matter that ships in the npm tarball and codemeta.json. Same
          # helper the other release workflows use.
          python - <<'PY'
          import conftest

          failures = conftest.release_version_failures()
          if failures:
              raise SystemExit("version lockstep violated: " + "; ".join(failures))
          print("Version lockstep OK across every version surface:", conftest.repo_version())
          PY
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          prerelease="$(python -c 'import conftest, sys; print("true" if conftest.is_prerelease(sys.argv[1]) else "false")' "$version")"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # The exact class of bug that shipped in 1.0.0: a `main` entry point that
      # throws on require, because SKILL.md was required as if it were
      # JavaScript. The exit status is asserted explicitly because a Windows
      # shim can swallow a non-zero exit.
      - name: Verify the entry point before packing
        run: |
          set -euo pipefail
          npm test
          if ! out="$(node index.js --validate)"; then
            echo "::error::index.js --validate failed in the working tree:" >&2
            echo "$out" >&2
            exit 1
          fi
          if ! out="$(node -e "const s = require('./index.js'); if (!s.loadSkill().valid) { process.exit(1); } console.log('npm entry OK', s.version);")"; then
            echo "::error::require('./index.js') failed in the working tree:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"

      # The published tarball must contain exactly the intended file set. This is
      # what stops `.github/`, `tests/` and `pyproject.toml` from being shipped
      # again, and what guarantees the launcher is present at all.
      - name: Enforce the tarball content allowlist
        run: |
          set -euo pipefail
          expected='LICENSE
          README.md
          SKILL.md
          VERSION
          index.js
          package.json'
          actual="$(npm pack --dry-run --json | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const parsed = JSON.parse(raw);
              const files = parsed[0].files.map((f) => f.path).sort();
              process.stdout.write(files.join("\n"));
            });
          ')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Tarball contents differ from the allowlist." >&2
            echo "expected:" >&2
            echo "$expected" >&2
            echo "actual:" >&2
            echo "$actual" >&2
            exit 1
          fi
          echo "tarball allowlist OK:"
          echo "$actual"

      # Prove the launcher works from a real install of the real tarball, not
      # just from the working tree.
      #
      # `npx` alone is not trusted here: on Windows the generated `.cmd` shim can
      # exit 0 even when the underlying script throws, which would let a broken
      # launcher reach the registry. So the exit status is asserted explicitly by
      # invoking the installed module directly.
      - name: Smoke test the packed tarball
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          echo "packed $tarball"
          workdir="$(mktemp -d)"
          cd "$workdir"
          npm init -y > /dev/null
          npm install --silent "$OLDPWD/$tarball"

          installed="./node_modules/quantum-reasoning-skill"
          test -f "$installed/SKILL.md" || { echo "::error::SKILL.md missing from the packed tarball" >&2; exit 1; }
          test -f "$installed/index.js" || { echo "::error::index.js missing from the packed tarball" >&2; exit 1; }
          test -f "$installed/package.json" || { echo "::error::package.json missing from the packed tarball" >&2; exit 1; }

          # Assert the exit status rather than trusting the launcher shim.
          if ! out="$(node "$installed/index.js" --validate)"; then
            echo "::error::The packed launcher's --validate failed:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"

          npx quantum-reasoning --validate

          # And assert `require()` works, which is what broke in 1.0.0.
          if ! out="$(node -e "const s = require('quantum-reasoning-skill'); if (!s.loadSkill().valid) { process.exit(1); } console.log('installed npm OK', s.version);")"; then
            echo "::error::require('quantum-reasoning-skill') failed against the packed tarball:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"

      - name: Check npm registry state
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          version="${{ steps.meta.outputs.version }}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name $version is already published to npm; treating this trigger as an idempotent no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not published yet"
          fi

      # The gate above skipped versions that are already on npm. When the version
      # is new, the upload must be exactly the content the version bump released:
      # npm 1.2.0 shipped a tarball built from a later commit (#60's unknown-flag
      # validation) because the first push after the release won the race for the
      # version number, and that tarball's own README still claimed 1.2.0 was
      # never published. npm versions are immutable, so the check runs before any
      # upload: every packed file must match the commit that introduced this
      # version. The tag is not usable as the reference because publish-release
      # creates it only after its own 900-second check gate, so a push-triggered
      # run would race it.
      - name: Refuse to publish content newer than the version bump
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          version = os.environ["VERSION"]

          def run(*args):
              return subprocess.run(args, capture_output=True)

          def version_at(rev):
              raw = run("git", "show", f"{rev}:package.json")
              if raw.returncode != 0:
                  return None
              try:
                  return json.loads(raw.stdout.decode("utf-8"))["version"]
              except (UnicodeDecodeError, ValueError, KeyError, TypeError):
                  return None

          head = run("git", "rev-parse", "HEAD").stdout.decode().strip()
          if version_at(head) != version:
              raise SystemExit(f"HEAD does not declare package.json version {version}")

          release = None
          for rev in run("git", "rev-list", "--first-parent", "HEAD").stdout.decode().split():
              if version_at(rev) != version:
                  break
              release = rev
          if release is None:
              raise SystemExit(f"cannot find the commit that introduced version {version}")
          if release == head:
              print(f"PASS: publishing {version} from its own version-bump commit {head[:9]}")
              raise SystemExit(0)

          packed = json.loads(
              run("npm", "pack", "--dry-run", "--json").stdout.decode("utf-8")
          )[0]["files"]
          differing = []
          for item in packed:
              path = item["path"]
              expected = run("git", "show", f"{release}:{path}")
              actual = run("git", "show", f"HEAD:{path}")
              if (
                  expected.returncode != 0
                  or actual.returncode != 0
                  or expected.stdout != actual.stdout
              ):
                  differing.append(path)
          if differing:
              raise SystemExit(
                  f"refusing to publish {version} from {head[:9]}: packed files differ from "
                  f"the version-bump commit {release[:9]} ({', '.join(differing)}). "
                  f"Bump the version and release the new content instead."
              )
          print(f"PASS: packed content matches the version-bump commit {release[:9]}")
          PY

      # Automatic version-trigger pushes use the repository's verified token path.
      # Manual dispatches preserve the explicit OIDC/token choice.
      - name: Resolve the requested publish mode
        id: mode
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TOKEN: ${{ inputs.use_token_fallback }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "${REQUESTED_TOKEN:-false}" in
              true|True|TRUE) requested="token" ;;
              false|False|FALSE|"") requested="trusted" ;;
              *)
                echo "::error::use_token_fallback must be a boolean, got '${REQUESTED_TOKEN}'" >&2
                exit 1
                ;;
            esac
          else
            # Automatic version-trigger pushes publish through OIDC Trusted
            # Publishing, matching the documented default. The token path is
            # reachable only through an explicit workflow_dispatch opt-in.
            requested="trusted"
          fi

          echo "requested=$requested" >> "$GITHUB_OUTPUT"

          if [ "$requested" = "token" ]; then
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "::error::use_token_fallback was requested but the NPM_TOKEN secret is not set. Refusing to publish." >&2
              exit 1
            fi
            echo "::warning::Publishing with NPM_TOKEN as explicitly requested; token publishes are not provenance-signed." >&2
          else
            echo "::notice::Publishing with OIDC Trusted Publishing and --provenance."
          fi

      # Trusted Publishing is the default for pushes and dispatches alike.
      - name: Publish with OIDC Trusted Publishing
        id: trusted
        if: steps.gate.outputs.skip != 'true' && steps.mode.outputs.requested == 'trusted'
        shell: bash
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--access public --provenance)
          # A prerelease must not move the `latest` dist-tag. `next` is the
          # conventional prerelease channel; stable releases claim `latest`
          # explicitly instead of relying on npm's implicit default.
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--tag next)
          else
            args+=(--tag latest)
          fi
          npm publish "${args[@]}"

      # Deliberate token mode. `--provenance` is deliberately absent: npm
      # generates provenance from the OIDC identity in the runner environment,
      # and passing `--provenance` with only a classic token configured makes npm
      # attempt an attestation it cannot produce. Verified against npm 11: the
      # publish fails outright rather than degrading quietly.
      - name: Publish with NPM_TOKEN (deliberate opt-in, no provenance)
        id: token
        if: steps.gate.outputs.skip != 'true' && steps.mode.outputs.requested == 'token'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--access public)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--tag next)
          else
            args+=(--tag latest)
          fi
          npm publish "${args[@]}"

      # Neither publish step tolerates failure, so a skipped step here means the
      # requested mode did not run at all.
      - name: Require a successful upload
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          TRUSTED_OUTCOME: ${{ steps.trusted.outcome }}
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          REQUESTED: ${{ steps.mode.outputs.requested }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "trusted" ]; then
            if [ "$TRUSTED_OUTCOME" != "success" ]; then
              echo "::error::npm Trusted Publishing failed. Configure a trusted publisher on npmjs.com for owner 'Furox-Art', repository 'quantum-reasoning-skill', workflow 'npm-publish.yml', environment 'npm'." >&2
              exit 1
            fi
          else
            if [ "$TOKEN_OUTCOME" != "success" ]; then
              echo "::error::npm publish failed in deliberate NPM_TOKEN mode." >&2
              exit 1
            fi
          fi
          echo "npm accepted $NAME@$VERSION (mode: $REQUESTED)"

      # An attested publish is the outcome that should be relied on. When the
      # default OIDC path succeeds, confirm the registry actually stored a
      # Sigstore attestation and fail the workflow if it did not.
      #
      # `npm publish --provenance` succeeding is not sufficient evidence: a
      # misconfigured trusted publisher or a registry-side failure can leave a
      # publish without one. 1.1.1 shipped exactly that way, so this is checked
      # rather than assumed. Attestations can take a moment to appear, hence the
      # bounded retry loop.
      #
      # The budget is 10 minutes, not the 2.5 minutes it used to be. On
      # 2026-10-22 npm accepted 1.2.0 at 11:50:48Z (`+ name@1.2.0`) but kept the
      # version and its attestation invisible until 11:55:33Z during a
      # "Degraded Publish, Install, and View Package" incident, so the old loop
      # failed a publish that had actually succeeded.
      - name: Verify the default publish is attested
        if: steps.gate.outputs.skip != 'true' && steps.trusted.outcome == 'success'
        shell: bash
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/-/npm/v1/attestations/${NAME}@${VERSION}")"
            if [ "$code" = "200" ]; then
              echo "npm stored a provenance attestation for $NAME@$VERSION"
              exit 0
            fi
            echo "attempt $attempt: attestations endpoint returned HTTP $code"
            sleep 30
          done
          echo "::error::$NAME@$VERSION was published via OIDC Trusted Publishing but the registry reports no attestation (HTTP $code)." >&2
          echo "::error::A release without provenance cannot be verified by consumers. Check the trusted publisher on npmjs.com matches owner 'Furox-Art', repository 'quantum-reasoning-skill', workflow 'npm-publish.yml', environment 'npm'." >&2
          exit 1

      # Same 10-minute budget as the attestation check, for the same reason: a
      # version can stay invisible for minutes after a successful upload.
      - name: Verify the published version
        shell: bash
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "npm reports $NAME@$VERSION"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Upload succeeded but $NAME@$VERSION is not visible on the registry yet." >&2
          exit 1