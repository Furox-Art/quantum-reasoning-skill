name: npm Publish

# Default-branch `push` only. No `workflow_run`, no `pull_request`. Publishing
# requires write access to main.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "index.js"
      - "VERSION"
      - "SKILL.md"
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Provenance attestation only; the registry write is done with the token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version and require version lockstep
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          version_file="$(tr -d '[:space:]' < VERSION)"
          version_file="${version_file#v}"
          if [ "$version_file" != "$version" ]; then
            echo "::error::package.json ($version) does not match VERSION ($version_file)." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the package before publishing
        run: |
          set -euo pipefail
          npm test
          # Fail early on the exact class of error that broke 1.0.0: a `main`
          # entry that throws on require.
          node -e "const s = require('./index.js'); if (!s.loadSkill().valid) { throw new Error('invalid skill contract'); } console.log('npm entry OK', s.version);"
          npm pack --dry-run

      - name: Smoke test the packed tarball
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          mkdir -p /tmp/qrs-npm-consumer
          cd /tmp/qrs-npm-consumer
          npm init -y > /dev/null
          npm install --silent "$OLDPWD/$tarball"
          npx quantum-reasoning --validate
          node -e "const s = require('quantum-reasoning-skill'); if (!s.loadSkill().valid) { throw new Error('invalid'); } console.log('installed npm OK', s.version);"

      - name: Check the version is not already published
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.name }}"
          version="${{ steps.meta.outputs.version }}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name $version is already published to npm. Bump VERSION and package.json." >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}