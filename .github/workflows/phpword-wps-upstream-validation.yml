name: PHPWord WPS upstream validation

on:
  push:
    branches:
      - ci/phpword-wps-upstream-validation

permissions:
  contents: read

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CI harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv
          coverage: none

      - name: Clone current PHPWord master
        run: git clone --depth 1 https://github.com/PHPOffice/PHPWord.git upstream

      - name: Rebuild and verify WPS patch payload
        shell: bash
        run: |
          set -euo pipefail
          cat phpword-wps-ci/chunk-*.b64 | base64 --decode > /tmp/phpword-wps-patch.zip
          echo '6021c3aceac09644bf16598c0e18a1f744c2a6dd9a424a1771105b02fdd10152  /tmp/phpword-wps-patch.zip' | sha256sum --check --strict
          unzip -t /tmp/phpword-wps-patch.zip

      - name: Overlay WPS patch and PHPStan fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phpword-wps-patch
          mkdir -p /tmp/phpword-wps-patch
          unzip -q /tmp/phpword-wps-patch.zip -d /tmp/phpword-wps-patch
          cp -a /tmp/phpword-wps-patch/phpword-wps-patch/src/PhpWord/Writer/WPS.php upstream/src/PhpWord/Writer/WPS.php
          mkdir -p upstream/src/PhpWord/Writer/WPS
          cp -a /tmp/phpword-wps-patch/phpword-wps-patch/src/PhpWord/Writer/WPS/. upstream/src/PhpWord/Writer/WPS/
          cp -a /tmp/phpword-wps-patch/phpword-wps-patch/tests/PhpWordTests/Writer/WPSTest.php upstream/tests/PhpWordTests/Writer/WPSTest.php
          python3 - <<'PY'
          from pathlib import Path

          io = Path('upstream/src/PhpWord/IOFactory.php')
          text = io.read_text()
          old = "['ODText', 'RTF', 'Word2007', 'HTML', 'PDF', 'EPub3']"
          new = "['ODText', 'RTF', 'Word2007', 'HTML', 'PDF', 'EPub3', 'WPS']"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one IOFactory writer list, found {text.count(old)}')
          io.write_text(text.replace(old, new, 1))

          test = Path('upstream/tests/PhpWordTests/Writer/WPSTest.php')
          text = test.read_text()
          text = text.replace('use PhpOffice\\PhpWord\\Writer\\WPS\\Validator;\n', '')
          text = text.replace('use PhpOffice\\PhpWord\\SimpleType\\Jc;\n', 'use PhpOffice\\PhpWord\\Settings;\nuse PhpOffice\\PhpWord\\SimpleType\\Jc;\n')
          old = '            $validation = (new Validator())->validateFile($file, "Hello Works\\rSecond paragraph\\r");\n'
          new = '            $validation = $writer->getLastValidation();\n            self::assertNotNull($validation);\n'
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace("            self::assertSame(['Arial', 'Courier New'], $validation['styles']['fontNames']);\n", "            self::assertSame([Settings::getDefaultFontName(), 'Courier New'], $validation['styles']['fontNames']);\n", 1)
          text = text.replace("            self::assertSame('Arial', $fonts[0]['name']);\n", "            self::assertSame(Settings::getDefaultFontName(), $fonts[0]['name']);\n", 1)
          text = text.replace("            self::assertSame(10, $fonts[0]['size']);\n", "            self::assertSame((int) Settings::getDefaultFontSize(), $fonts[0]['size']);\n", 1)
          test.write_text(text)
          PY
          python3 phpword-wps-ci/fix_phpstan.py upstream
          python3 - <<'PY'
          from pathlib import Path
          path = Path('upstream/src/PhpWord/Writer/WPS/Validator.php')
          text = path.read_text()
          needle = 'namespace PhpOffice\\PhpWord\\Writer\\WPS;\n'
          replacement = needle + '\nuse RuntimeException;\n'
          if 'use RuntimeException;' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('Could not locate Validator namespace for RuntimeException import')
              text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          cd upstream
          git diff --check

      - name: Validate Composer configuration
        working-directory: upstream
        run: composer validate --strict

      - name: Install PHPWord development dependencies
        working-directory: upstream
        run: composer install --ansi --prefer-dist --no-interaction --no-progress

      - name: Apply upstream coding style exactly
        working-directory: upstream
        run: ./vendor/bin/php-cs-fixer fix --ansi

      - name: Run WPS tests first
        working-directory: upstream
        run: ./vendor/bin/phpunit -c phpunit.xml.dist --no-coverage tests/PhpWordTests/Writer/WPSTest.php

      - name: Show WPS coding-style diff
        working-directory: upstream
        shell: bash
        run: |
          git diff -- src/PhpWord/IOFactory.php src/PhpWord/Writer/WPS.php src/PhpWord/Writer/WPS tests/PhpWordTests/Writer/WPSTest.php
          git diff --check

      - name: Run upstream composer check
        working-directory: upstream
        run: composer check
