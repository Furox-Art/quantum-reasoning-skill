name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate skill repository contract
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            SKILL.md README.md LICENSE CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md CITATION.cff \
            examples/usage.md examples/host-integration.md \
            reference/branch_controller.py \
            docs/MEASUREMENT.md docs/COMPATIBILITY.md \
            benchmark/README.md benchmark/cases.jsonl benchmark/evaluate.py benchmark/validate_submission.py \
            benchmark/schemas/result.schema.json benchmark/schemas/metadata.schema.json benchmark/schemas/comparison.schema.json \
            tests/test_reference.py tests/test_benchmark.py tests/test_submission_validation.py \
            .github/ISSUE_TEMPLATE/benchmark-result.yml .github/ISSUE_TEMPLATE/bug-report.yml \
            .github/ISSUE_TEMPLATE/feature-request.yml .github/PULL_REQUEST_TEMPLATE.md; do
            test -s "$required"
          done

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd().resolve()
          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          lines = skill.splitlines()
          if not lines or lines[0].strip() != "---":
              raise SystemExit("SKILL.md must start with YAML front matter")
          try:
              end = next(i for i, line in enumerate(lines[1:], start=1) if line.strip() == "---")
          except StopIteration as exc:
              raise SystemExit("SKILL.md front matter is not closed") from exc
          fields = {}
          for line in lines[1:end]:
              if ":" in line:
                  key, value = line.split(":", 1)
                  fields[key.strip()] = value.strip()
          if fields.get("name") != "quantum-reasoning":
              raise SystemExit("SKILL.md front matter must declare name: quantum-reasoning")
          if not fields.get("description"):
              raise SystemExit("SKILL.md front matter must contain a non-empty description")
          if len(lines[end + 1:]) < 20:
              raise SystemExit("SKILL.md body is unexpectedly short")

          readme = (root / "README.md").read_text(encoding="utf-8")
          for required in (
              "SKILL.md", "examples/usage.md", "examples/host-integration.md",
              "reference/branch_controller.py", "docs/MEASUREMENT.md", "docs/COMPATIBILITY.md",
              "benchmark/README.md", "CONTRIBUTING.md", "SECURITY.md", "CITATION.cff",
          ):
              if required not in readme:
                  raise SystemExit(f"README.md must reference {required}")

          markdown_files = [
              root / "README.md", root / "SKILL.md", root / "CONTRIBUTING.md", root / "SECURITY.md",
              root / "examples/usage.md", root / "examples/host-integration.md",
              root / "benchmark/README.md", root / "docs/MEASUREMENT.md", root / "docs/COMPATIBILITY.md",
          ]
          link_pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          for document in markdown_files:
              text = document.read_text(encoding="utf-8")
              for raw_target in link_pattern.findall(text):
                  target = raw_target.strip().split("#", 1)[0].split("?", 1)[0]
                  if not target or "://" in target or target.startswith(("mailto:", "#")):
                      continue
                  resolved = (document.parent / target).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError as exc:
                      raise SystemExit(f"{document.relative_to(root)} links outside repository: {raw_target}") from exc
                  if not resolved.exists():
                      raise SystemExit(f"Broken relative link in {document.relative_to(root)}: {raw_target}")

          case_path = root / "benchmark" / "cases.jsonl"
          seen_ids = set()
          for line_number, raw in enumerate(case_path.read_text(encoding="utf-8").splitlines(), start=1):
              if not raw.strip():
                  continue
              try:
                  case = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"benchmark/cases.jsonl:{line_number}: invalid JSON: {exc}") from exc
              required = {"id", "domain", "prompt", "accepted_answers"}
              missing = required - set(case)
              if missing:
                  raise SystemExit(f"benchmark/cases.jsonl:{line_number}: missing {sorted(missing)}")
              case_id = str(case["id"])
              if case_id in seen_ids:
                  raise SystemExit(f"duplicate benchmark case id: {case_id}")
              seen_ids.add(case_id)
              if not isinstance(case["accepted_answers"], list) or not case["accepted_answers"]:
                  raise SystemExit(f"benchmark/cases.jsonl:{line_number}: accepted_answers must be non-empty")

          for schema_path in sorted((root / "benchmark" / "schemas").glob("*.schema.json")):
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              if schema.get("$schema") != "https://json-schema.org/draft/2020-12/schema":
                  raise SystemExit(f"{schema_path}: expected JSON Schema draft 2020-12")
              if schema.get("type") != "object" or not schema.get("required"):
                  raise SystemExit(f"{schema_path}: must define an object with required fields")

          cff = (root / "CITATION.cff").read_text(encoding="utf-8")
          for marker in ("cff-version: 1.2.0", "title:", "authors:", "repository-code:", "license: MIT"):
              if marker not in cff:
                  raise SystemExit(f"CITATION.cff missing {marker!r}")

          print("Skill repository contract validated successfully.")
          PY

      - name: Compile Python sources
        run: python -m compileall -q reference benchmark tests

      - name: Run behavioral tests
        run: python -m unittest discover -s tests -v

      - name: Validate community benchmark bundles
        run: python benchmark/validate_submission.py --root benchmark/results/community --allow-empty

      - name: Check benchmark CLIs
        run: |
          python benchmark/evaluate.py --help > /dev/null
          python benchmark/validate_submission.py --help > /dev/null
