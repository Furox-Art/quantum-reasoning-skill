name: validate-skill

# Deliberately NOT `workflow_run`.
#
# The previous release automation used `workflow_run`, which runs in the
# privileged base-repository context with a caller-supplied head SHA. A fork
# could therefore cause privileged code to execute. This workflow is entirely
# unprivileged (`contents: read`) and therefore safe on `pull_request`,
# including from forks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Repository contract (unchanged behaviour, hardened paths)
  # ---------------------------------------------------------------------------
  contract:
    name: repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # `yaml.safe_load` accepts duplicate mapping keys and silently keeps the
      # last one, so every "does this parse?" check passed a workflow that GitHub
      # rejects outright. npm-publish.yml shipped with `shell`, `env` and `run`
      # each defined twice in one step, which made it undispatchable (HTTP 422).
      # This loader raises on duplicates, and also checks step structure and step
      # shell syntax so the same class of defect cannot reach main again.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      - name: Validate workflow files with a duplicate-rejecting loader
        run: python bin/check_workflows.py --verbose

      - name: Validate skill repository contract
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            SKILL.md README.md LICENSE CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md CITATION.cff \
            examples/usage.md examples/host-integration.md \
            quantum_reasoning_skill/reference/branch_controller.py \
            docs/MEASUREMENT.md docs/COMPATIBILITY.md \
            quantum_reasoning_skill/benchmark/README.md quantum_reasoning_skill/benchmark/cases.jsonl \
            quantum_reasoning_skill/benchmark/evaluate.py quantum_reasoning_skill/benchmark/validate_submission.py \
            quantum_reasoning_skill/benchmark/schemas/case.schema.json quantum_reasoning_skill/benchmark/schemas/result.schema.json \
            quantum_reasoning_skill/benchmark/schemas/metadata.schema.json quantum_reasoning_skill/benchmark/schemas/comparison.schema.json \
            tests/test_reference.py tests/test_benchmark.py tests/test_submission_validation.py \
            tests/test_readme_badges.py tests/test_release_check_polling.py \
            tests/test_release_integrity.py tests/test_workflow_validation.py \
            package.json index.js pyproject.toml conftest.py \
            bin/quantum-reasoning bin/check_release_contract.py bin/wait_for_required_checks.py \
            bin/check_toolchain_pins.py bin/check_release_integrity.py \
            bin/check_workflows.py \
            .github/ISSUE_TEMPLATE/benchmark-result.yml .github/ISSUE_TEMPLATE/bug-report.yml \
            .github/ISSUE_TEMPLATE/feature-request.yml .github/PULL_REQUEST_TEMPLATE.md; do
            test -s "$required"
          done

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd().resolve()
          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          lines = skill.splitlines()
          if not lines or lines[0].strip() != "---":
              raise SystemExit("SKILL.md must start with YAML front matter")
          try:
              end = next(i for i, line in enumerate(lines[1:], start=1) if line.strip() == "---")
          except StopIteration as exc:
              raise SystemExit("SKILL.md front matter is not closed") from exc
          fields = {}
          for line in lines[1:end]:
              if ":" in line:
                  key, value = line.split(":", 1)
                  fields[key.strip()] = value.strip()
          if fields.get("name") != "quantum-reasoning":
              raise SystemExit("SKILL.md front matter must declare name: quantum-reasoning")
          if not fields.get("description"):
              raise SystemExit("SKILL.md front matter must contain a non-empty description")
          if len(lines[end + 1:]) < 20:
              raise SystemExit("SKILL.md body is unexpectedly short")

          readme = (root / "README.md").read_text(encoding="utf-8")
          for required in (
              "SKILL.md", "examples/usage.md", "examples/host-integration.md",
              "quantum_reasoning_skill/reference/branch_controller.py", "docs/MEASUREMENT.md", "docs/COMPATIBILITY.md",
              "quantum_reasoning_skill/benchmark/README.md", "CONTRIBUTING.md", "SECURITY.md", "CITATION.cff",
          ):
              if required not in readme:
                  raise SystemExit(f"README.md must reference {required}")

          markdown_files = [
              root / "README.md", root / "SKILL.md", root / "CONTRIBUTING.md", root / "SECURITY.md",
              root / "CHANGELOG.md",
              root / "examples/usage.md", root / "examples/host-integration.md",
              root / "quantum_reasoning_skill/benchmark/README.md", root / "docs/MEASUREMENT.md", root / "docs/COMPATIBILITY.md",
              root / "docs/getting-started.md",
          ]
          link_pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          for document in markdown_files:
              if not document.is_file():
                  raise SystemExit(f"markdown file missing from link check: {document.relative_to(root)}")
              text = document.read_text(encoding="utf-8")
              for raw_target in link_pattern.findall(text):
                  target = raw_target.strip().split("#", 1)[0].split("?", 1)[0]
                  if not target or "://" in target or target.startswith(("mailto:", "#")):
                      continue
                  resolved = (document.parent / target).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError as exc:
                      raise SystemExit(f"{document.relative_to(root)} links outside repository: {raw_target}") from exc
                  if not resolved.exists():
                      raise SystemExit(f"Broken relative link in {document.relative_to(root)}: {raw_target}")

          case_path = root / "quantum_reasoning_skill" / "benchmark" / "cases.jsonl"
          seen_ids = set()
          for line_number, raw in enumerate(case_path.read_text(encoding="utf-8").splitlines(), start=1):
              if not raw.strip():
                  continue
              try:
                  case = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"quantum_reasoning_skill/benchmark/cases.jsonl:{line_number}: invalid JSON: {exc}") from exc
              required = {"id", "domain", "prompt", "accepted_answers"}
              missing = required - set(case)
              if missing:
                  raise SystemExit(f"quantum_reasoning_skill/benchmark/cases.jsonl:{line_number}: missing {sorted(missing)}")
              case_id = str(case["id"])
              if case_id in seen_ids:
                  raise SystemExit(f"duplicate benchmark case id: {case_id}")
              seen_ids.add(case_id)
              if not isinstance(case["accepted_answers"], list) or not case["accepted_answers"]:
                  raise SystemExit(f"quantum_reasoning_skill/benchmark/cases.jsonl:{line_number}: accepted_answers must be non-empty")

          schemas = sorted((root / "quantum_reasoning_skill" / "benchmark" / "schemas").glob("*.schema.json"))
          if len(schemas) < 4:
              raise SystemExit("expected case, result, metadata and comparison JSON Schemas")
          for schema_path in schemas:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              if schema.get("$schema") != "https://json-schema.org/draft/2020-12/schema":
                  raise SystemExit(f"{schema_path}: expected JSON Schema draft 2020-12")
              if schema.get("type") != "object" or not schema.get("required"):
                  raise SystemExit(f"{schema_path}: must define an object with required fields")

          version = (root / "VERSION").read_text(encoding="utf-8").strip().lstrip("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[.-][0-9A-Za-z.-]+)?", version):
              raise SystemExit("VERSION is not a valid semantic version")
          cff = (root / "CITATION.cff").read_text(encoding="utf-8")
          for marker in ("cff-version: 1.2.0", "title:", "authors:", "repository-code:", "license: MIT"):
              if marker not in cff:
                  raise SystemExit(f"CITATION.cff missing {marker!r}")
          if f"version: {version}" not in cff:
              raise SystemExit("CITATION.cff version must match VERSION")

          action_use = re.compile(r"uses:\s+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([^\s#]+)")
          forbidden = re.compile(
              r"^\s*(?:- name:.*\n)?\s*(?:continue-on-error|workflow_run)\s*:", re.MULTILINE
          )
          for workflow in (root / ".github" / "workflows").glob("*.yml"):
              text = workflow.read_text(encoding="utf-8")
              for action, ref in action_use.findall(text):
                  if not re.fullmatch(r"[0-9a-f]{40}", ref):
                      raise SystemExit(f"{workflow.name}: {action} must be pinned to an exact commit SHA")
              # Only real YAML keys are forbidden; mentions inside comments and
              # inside this very assertion are fine.
              for key in forbidden.findall(text):
                  raise SystemExit(
                      f"{workflow.name}: {key} is forbidden; `continue-on-error` hides "
                      "publish failures and `workflow_run` lets a fork trigger privileged code."
                  )
              # The release workflows must not be reachable from an untrusted event.
              if workflow.name != "validate-skill.yml":
                  if re.search(r"^\s{2}(pull_request_target|workflow_run)\s*:", text, re.MULTILINE):
                      raise SystemExit(
                          f"{workflow.name}: privileged workflows may not use "
                          "pull_request_target or workflow_run"
                      )

          print("Skill repository contract validated successfully.")
          PY

      # The registry is the only authority on whether a published version carries
      # an attestation, so the attested set is passed in explicitly rather than
      # hardcoded. A failure here means a document claims provenance that does not
      # exist, which is worse than saying nothing at all.
      - name: Verify supply-chain claims match the registry
        shell: bash
        run: |
          set -euo pipefail
          attested="$(python - <<'PY'
          import json
          import urllib.request

          url = (
              "https://registry.npmjs.org/-/npm/v1/attestations/"
              "quantum-reasoning-skill"
          )
          found = []
          for version in ("1.0.0", "1.1.0", "1.1.1"):
              try:
                  with urllib.request.urlopen(f"{url}@{version}", timeout=20) as response:
                      if response.status == 200:
                          json.loads(response.read().decode("utf-8"))
                          found.append(version)
              except Exception:
                  continue
          print(",".join(found))
          PY
          )"
          echo "npm versions with an attestation: ${attested:-none}"
          python bin/check_release_integrity.py --attested-npm "$attested"

          python -c "import conftest, sys; sys.exit(1) if conftest.version_lockstep_failures() else None" \
            || python -c "
          import conftest
          failures = conftest.version_lockstep_failures()
          if failures:
              raise SystemExit('version lockstep violated: ' + '; '.join(failures))
          print('Version lockstep OK:', conftest.repo_version())
          "

      - name: Compile Python sources
        run: python -m compileall -q quantum_reasoning_skill tests

      - name: Validate community benchmark bundles
        run: python quantum_reasoning_skill/benchmark/validate_submission.py --root quantum_reasoning_skill/benchmark/results/community --allow-empty

      - name: Check benchmark CLIs
        run: |
          python quantum_reasoning_skill/benchmark/evaluate.py --help > /dev/null
          python quantum_reasoning_skill/benchmark/validate_submission.py --help > /dev/null
          # `python -m` must work too: the tooling imports through the package
          # rather than relying on the script's own directory being on sys.path.
          python -m quantum_reasoning_skill.benchmark.validate_submission --help > /dev/null
          python -m quantum_reasoning_skill.benchmark.evaluate --help > /dev/null

  # ---------------------------------------------------------------------------
  # Behavioural tests across the declared Python support range
  # ---------------------------------------------------------------------------
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # The workflow-validation tests parse every workflow with PyYAML's
      # duplicate-rejecting loader, which is what proves the parser in
      # bin/check_workflows.py rejects what yaml.safe_load accepts.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      - name: Run behavioral tests without skips
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest-matrix.log
          if grep -Eq "skipped=[1-9][0-9]*" unittest-matrix.log; then
            echo "::error::Skipped tests are not permitted"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Lint / format
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.17.0"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check (advisory)
        # `quantum_reasoning_skill/` (including `benchmark/` and `reference/`) and
        # `tests/` are owned by other maintainers and are not yet formatted. This
        # reports drift without blocking; it becomes blocking once those areas are
        # formatted.
        run: ruff format --check bin conftest.py

  # ---------------------------------------------------------------------------
  # Type checking
  # ---------------------------------------------------------------------------
  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install mypy
        run: python -m pip install --disable-pip-version-check "mypy==2.4.0"

      - name: Mypy strict
        run: mypy

  # ---------------------------------------------------------------------------
  # Coverage with a ratcheting threshold
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check "coverage==7.16.2" "pyyaml==6.0.3"

      - name: Enforce 100% statement and branch coverage with zero skips
        shell: bash
        run: |
          set -euo pipefail
          coverage run -m unittest discover -s tests -v 2>&1 | tee unittest-coverage.log
          if grep -Eq "skipped=[1-9][0-9]*" unittest-coverage.log; then
            echo "::error::Skipped tests are not permitted"
            exit 1
          fi
          coverage report --fail-under=100

      - name: Write coverage XML
        run: coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Build + twine metadata validation
  # ---------------------------------------------------------------------------
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        # twine >= 7.0.0 is required: 6.x hardcodes a metadata-version list
        # ending at 2.4, so `twine check --strict` rejects artifacts whose
        # backend legitimately emits Metadata-Version 2.5. Guarded in CI by
        # `python bin/check_toolchain_pins.py`.
        run: python -m pip install --disable-pip-version-check "build==1.6.1" "twine==7.0.0"

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Twine check
        run: python -m twine check --strict dist/*

      # Packaging is part of the release surface. The editable install proves
      # the console script is generated from the package module
      # `quantum_reasoning_skill/cli.py` and runs against the packaged SKILL.md,
      # independently of the built wheel.
      - name: Editable install in a clean venv and run the console script
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv-editable"
          "$RUNNER_TEMP/venv-editable/bin/python" -m pip install --disable-pip-version-check --quiet -e .
          "$RUNNER_TEMP/venv-editable/bin/quantum-reasoning" --validate

      # Top-level wheel names are an API contract: only the importable package
      # and its own dist-info may sit at the root of site-packages. Assets
      # (SKILL.md, VERSION, reference, benchmark, docs, examples) belong inside
      # `quantum_reasoning_skill/`, not as sibling top-level distributions that
      # could collide with or shadow another package.
      - name: Assert the wheel ships only the package and its dist-info
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {[w.name for w in wheels]}")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = [name for name in archive.namelist() if name.strip("/")]
          top_level = {name.split("/", 1)[0] for name in names}
          dist_info = {name for name in top_level if name.endswith(".dist-info")}
          if "quantum_reasoning_skill" not in top_level:
              raise SystemExit(f"{wheel.name}: quantum_reasoning_skill package is missing")
          if len(dist_info) != 1:
              raise SystemExit(
                  f"{wheel.name}: expected exactly one dist-info directory, found {sorted(dist_info)}"
              )
          unexpected = top_level - {"quantum_reasoning_skill"} - dist_info
          if unexpected:
              raise SystemExit(
                  f"{wheel.name}: unexpected top-level entries {sorted(unexpected)}; "
                  "only quantum_reasoning_skill and its dist-info may ship"
              )
          print(f"{wheel.name}: top-level entries {sorted(top_level)}")
          PY

      # The sdist is a separate build path with different file selection,
      # force-includes and build isolation, so a working wheel does not prove
      # it. Install the sdist itself into a fresh venv and run the script.
      - name: Install the sdist in a fresh venv and run the console script
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected exactly one sdist, found ${#sdists[@]}"
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/python" -m pip install --disable-pip-version-check --quiet "${sdists[0]}"
          "$RUNNER_TEMP/venv-sdist/bin/quantum-reasoning" --validate

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*

  # ---------------------------------------------------------------------------
  # REQUIRED CHECK: "toolchain pins".
  #
  # Guards the relationship between the twine pin and the build-backend pin.
  # twine 6.x replaces packaging's metadata-version list with a hardcoded one
  # ending at 2.4, so `twine check --strict` rejects valid artifacts whose
  # backend emits Metadata-Version 2.5. Bumping either pin alone therefore breaks
  # the next release, and UNPINNED must not pass.
  #
  # This is a separate job rather than a step inside `build distributions` so it
  # is a first-class, independently required check: a downgrade fails here by
  # name, and cannot be masked by the build job being skipped or restructured.
  #
  # The metadata version is measured from a wheel this job builds itself, so the
  # assertion is anchored to what the pinned backend actually emits rather than
  # to a hardcoded expectation.
  # ---------------------------------------------------------------------------
  toolchain-pins:
    name: toolchain pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "build==1.6.1"

      - name: Build a wheel to measure the emitted metadata version
        run: python -m build --wheel --outdir dist

      - name: Assert every twine check workflow pins twine new enough
        shell: bash
        run: |
          set -euo pipefail
          emitted="$(python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              for line in archive.read(name).decode("utf-8").splitlines():
                  if line.startswith("Metadata-Version:"):
                      print(line.split(":", 1)[1].strip())
                      break
          PY
          )"
          echo "pinned backend emits Metadata-Version: $emitted"
          python bin/check_toolchain_pins.py --metadata-version "$emitted"

  # ---------------------------------------------------------------------------
  # THE RELEASE GATE.
  #
  # Installs the built wheel into a clean environment and asserts the surface
  # this distribution actually provides: the skill contract (`SKILL.md`) ships
  # inside the wheel, the documented console entry point runs against it, and
  # the reference branch controller imports and its public API is callable.
  #
  # A negative control then removes the installed assets and requires the gate
  # to fail, so the gate cannot silently degrade into a no-op.
  #
  # Note: an earlier revision asserted a `ReasoningSession` class. That class
  # never existed in this codebase; the README claim was fabricated and has been
  # removed. Asserting it made the gate impossible to pass.
  # ---------------------------------------------------------------------------
  api-contract:
    name: installed API contract
    runs-on: ubuntu-latest
    needs: [contract, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist

      - name: Install the built wheel
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl | head -n1)"
          echo "Installing $wheel"
          python -m pip install --disable-pip-version-check "$wheel"
          # Prove the asset contract from the consumer's point of view.
          python -c "import quantum_reasoning_skill as q, pathlib; print('package dir:', pathlib.Path(q.__file__).parent)"
          quantum-reasoning --validate

      # The gate asserts the surface this package actually provides: SKILL.md
      # resolves inside the installed wheel, the documented console entry point
      # runs, and the reference branch controller imports and is callable.
      - name: Assert the installed API contract
        run: python bin/check_release_contract.py

      # Negative control: proves the gate is fail-closed. If hiding an installed
      # asset stopped failing the gate, this step fails.
      - name: Negative control (gate must be fail-closed)
        run: python bin/check_release_contract.py --negative-control

      - name: Verify the npm entry point
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm test
          npm pack --dry-run
          node -e "const s = require('./index.js'); if (!s.loadSkill().valid) { throw new Error('invalid skill contract'); } console.log('npm entry OK', s.version);"

      - name: Install the npm tarball and smoke test it
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          mkdir -p /tmp/qrs-consumer
          cd /tmp/qrs-consumer
          npm init -y > /dev/null
          npm install --silent "$OLDPWD/$tarball"
          npx quantum-reasoning --validate
          node -e "const s = require('quantum-reasoning-skill'); if (!s.loadSkill().valid) { throw new Error('invalid'); } console.log('installed npm OK', s.version);"