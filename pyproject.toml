[build-system]
# hatchling >= 1.32 emits Metadata-Version 2.5. Older releases emit 2.4, which
# is what twine 7.0.0 still accepts; both are valid, but the pin must not go
# backwards past the metadata version `twine check` can parse. See
# .github/workflows/validate-skill.yml for the guard that enforces this.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "quantum-reasoning-skill"
version = "1.2.0"
description = "Quantum-inspired multi-branch reasoning for AI agents: explore, score, prune, and merge solution paths"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Furox-Art" }]
keywords = ["ai-agents", "llm-agents", "agent-skills", "claude-skill", "reasoning", "quantum-inspired", "multi-branch", "multi-hypothesis", "decision-making", "problem-solving", "planning", "search", "tree-of-thought", "exploration", "mcp", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Furox-Art/quantum-reasoning-skill"
Repository = "https://github.com/Furox-Art/quantum-reasoning-skill"
Issues = "https://github.com/Furox-Art/quantum-reasoning-skill/issues"

# `quantum-reasoning` is a standalone skill inspector that reads the packaged
# SKILL.md and reports the skill contract. It lives in the importable package at
# `quantum_reasoning_skill/cli.py`; `bin/quantum-reasoning` is a thin checkout
# launcher for the same entry point.
[project.scripts]
quantum-reasoning = "quantum_reasoning_skill.cli:main"

[dependency-groups]
# `pyyaml` is a build/CI-only dependency. bin/check_workflows.py parses every
# workflow with a duplicate-rejecting loader, and the tests prove that loader
# rejects documents `yaml.safe_load` accepts. The published package still
# declares no runtime dependencies.
dev = [
  "build==1.6.1",
  "coverage==7.16.2",
  "mypy==2.4.0",
  "pyyaml==6.0.3",
  "ruff==0.17.1",
  "twine==7.0.0",
]

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------
# The skill is only useful if its assets travel with the distribution. The
# importable package, the skill contract and the benchmark tooling are all
# shipped; tests and CI configuration are not.
[tool.hatch.build.targets.wheel]
packages = ["quantum_reasoning_skill"]
# Assets and tooling ship *inside* the package instead of install-time top-level
# directories (`docs/`, `examples/`), which would pollute site-packages with
# generic names every project could claim. `reference/` and `benchmark/` are
# ordinary package subdirectories now, so `packages` ships them without a
# force-include mapping.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "quantum_reasoning_skill/SKILL.md"
"VERSION" = "quantum_reasoning_skill/VERSION"
"docs" = "quantum_reasoning_skill/docs"
"examples" = "quantum_reasoning_skill/examples"

[tool.hatch.build.targets.sdist]
include = [
  "/quantum_reasoning_skill",
  "/docs",
  "/examples",
  "/tests",
  "/bin",
  "/.github",
  "/SKILL.md",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CITATION.cff",
  "/VERSION",
  "/index.js",
  "/package.json",
  "/pyproject.toml",
]

[tool.hatch.build.targets.sdist.force-include]
"bin/quantum-reasoning" = "bin/quantum-reasoning"

# ---------------------------------------------------------------------------
# Quality tooling (new gates; see .github/workflows/validate-skill.yml)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "C4",       # comprehensions
  "TRY",      # exception style
]
ignore = [
  "E501",    # line length is handled by the formatter
  "TRY003",  # long messages in `raise` improve CI diagnostics
]

# The repository is not yet `ruff format` clean. Formatting is therefore
# advisory only for now: the lint job below reports it without failing, and the
# gate becomes blocking once the owning areas are formatted.
[tool.ruff.format]
exclude = [
  "tests",
  "quantum_reasoning_skill",
]

[tool.ruff.lint.per-file-ignores]
# NOTE: `quantum_reasoning_skill/benchmark/`, `quantum_reasoning_skill/reference/`,
# `tests/` and the rest of `quantum_reasoning_skill/` are owned by other
# maintainers. These are narrowly scoped suppressions for the exact rules those
# files currently violate, so that the lint gate is green today while still
# catching *new* violations of every other rule. Remove each entry as the owning
# area is cleaned up.
"quantum_reasoning_skill/benchmark/evaluate.py" = ["I001", "SIM102", "TRY004", "UP035", "UP038"]
"quantum_reasoning_skill/benchmark/validate_submission.py" = ["E401", "F401", "I001", "TRY004"]
"quantum_reasoning_skill/reference/branch_controller.py" = ["UP035"]
"quantum_reasoning_skill/__init__.py" = ["W293"]
"tests/*" = ["E401", "I001", "TRY002", "W292"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
files = ["quantum_reasoning_skill", "bin/quantum-reasoning"]

[[tool.mypy.overrides]]
module = ["quantum_reasoning_skill.benchmark.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["quantum_reasoning_skill"]
omit = [
  "*/tests/*",
  "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Full Python production-source statement and branch coverage is required.
# A regression must fail CI rather than silently lower the quality threshold.
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]