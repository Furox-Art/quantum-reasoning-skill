[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-reasoning-skill"
version = "0.1.0"
description = "A quantum-inspired, model-agnostic multi-branch reasoning engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qreason-demo = "qreason.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
