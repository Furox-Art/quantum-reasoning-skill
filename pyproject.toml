[build-system]  
requires = ["hatchling"]  
build-backend = "hatchling.build"  
  
[project]  
name = "quantum-reasoning-skill"  
version = "1.0.0"  
description = "Quantum-inspired reasoning skill for exploring multiple solution paths"  
readme = "README.md"  
license = "MIT"  
requires-python = ">=3.10"  
authors = [{ name = "Furox-Art" }]  
keywords = ["ai-agents", "reasoning", "quantum-inspired", "multi-branch"]  
classifiers = [  
  "Development Status :: 4 - Beta",  
  "Intended Audience :: Developers",  
  "License :: OSI Approved :: MIT License",  
  "Programming Language :: Python :: 3",  
]  
dependencies = []  
  
[project.urls]  
Homepage = "https://github.com/Furox-Art/quantum-reasoning-skill"  
Repository = "https://github.com/Furox-Art/quantum-reasoning-skill"  
Issues = "https://github.com/Furox-Art/quantum-reasoning-skill/issues" 
