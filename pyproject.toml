[build-system]  
requires = ["hatchling"]  
build-backend = "hatchling.build"  
  
[project]  
name = "quantum-reasoning-skill"  
version = "1.0.1"  
description = "Quantum-inspired multi-branch reasoning for AI agents: explore, score, prune, and merge solution paths"  
readme = "README.md"  
license = "MIT"  
requires-python = ">=3.10"  
authors = [{ name = "Furox-Art" }]  
keywords = ["ai-agents", "llm-agents", "agent-skills", "claude-skill", "reasoning", "quantum-inspired", "multi-branch", "multi-hypothesis", "decision-making", "problem-solving", "planning", "search", "tree-of-thought", "exploration", "mcp", "verification"]  
classifiers = [  
  "Development Status :: 4 - Beta",  
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",  
  "License :: OSI Approved :: MIT License",  
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",  
]  
dependencies = []  
  
[project.urls]  
Homepage = "https://github.com/Furox-Art/quantum-reasoning-skill"  
Repository = "https://github.com/Furox-Art/quantum-reasoning-skill"  
Issues = "https://github.com/Furox-Art/quantum-reasoning-skill/issues" 
